databases:
  - name: trader-assistant-db
    plan: free
    databaseName: trader_assistant
    user: trader_user

services:
  - type: web
    name: trader-assistant
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install --include=dev && npm run build && cd ../backend && npm install
    startCommand: cd backend && node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: trader-assistant-db
          property: connectionString
      - key: ALPHA_VANTAGE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
